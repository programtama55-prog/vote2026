<!DOCTYPE html>
<html lang="ja" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuthCore - 安全なセッション管理システム</title>
    <meta name="description" content="AuthCore 認証・アカウント管理プラットフォーム">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans JP', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <!-- Google Fonts & Lucide Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Supabase Environment Config & Import Map -->
    <script src="./env.js"></script>
    <script type="importmap">
        {
            "imports": {
                "@/lib/supabase.js": "./lib/supabase.js",
                "@/lib/utils.js": "./lib/utils.js",
                "@/lib/auth.js": "./lib/auth.js"
            }
        }
    </script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 flex flex-col justify-between selection:bg-indigo-500 selection:text-white relative overflow-hidden font-sans antialiased">
    <!-- 背景のグローエフェクト -->
    <div class="absolute -top-40 -left-40 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-purple-600/20 rounded-full blur-3xl pointer-events-none"></div>

    <!-- トースト通知コンテナ -->
    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2"></div>

    <!-- ヘッダー -->
    <header class="px-6 py-4 border-b border-slate-800/80 flex items-center justify-between backdrop-blur-sm z-10">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center shadow-lg shadow-indigo-500/30">
                <i data-lucide="layers" class="w-4 h-4 text-white"></i>
            </div>
            <span class="font-bold tracking-tight text-lg bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">
                AuthCore
            </span>
        </div>
        <div id="header-user-actions" class="flex items-center gap-3 text-sm"></div>
    </header>

    <!-- メインコンテンツ -->
    <main class="flex-1 flex items-center justify-center p-4 z-10">
        <div class="w-full max-w-md" id="app-view-container">
            <!-- JSによって login | register | forgot | dashboard 画面が動的描画されます -->
        </div>
    </main>

    <!-- フッター -->
    <footer class="py-4 text-center text-xs text-slate-500 border-t border-slate-900 z-10">
        &copy; 2026 AuthCore Platform. 安全なセッション管理システム
    </footer>

    <!-- Script -->
    <script type="module" src="./login.js"></script>
</body>
</html>

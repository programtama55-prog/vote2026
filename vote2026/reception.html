<!DOCTYPE html>
<html lang="ja" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>こども選挙 - 受付スタッフ管理画面 (S01〜S06)</title>
    <meta name="description" content="こども選挙の受付スタッフ専用画面です。参加者の受付登録および受付履歴ログ管理を行います。">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        staff: {
                            primary: '#4f46e5', // Indigo 600
                            primaryHover: '#4338ca',
                            secondary: '#0ea5e9', // Sky 500
                            success: '#10b981', // Emerald 500
                            warning: '#f59e0b', // Amber 500
                            danger: '#ef4444', // Red 500
                            bg: '#f8fafc' // Slate 50
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans JP', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <!-- Google Fonts & Font Awesome Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        body {
            font-family: 'Noto Sans JP', sans-serif;
        }
        /* Tap targets optimized for tablet use */
        .tablet-btn {
            min-height: 54px;
        }
    </style>

    <!-- Supabase Environment Config -->
    <script src="./env.js"></script>

    <!-- Import Map definition to allow module-based relative paths -->
    <script type="importmap">
        {
            "imports": {
                "@/lib/supabase.js": "./lib/supabase.js",
                "@/lib/utils.js": "./lib/utils.js",
                "@/lib/auth.js": "./lib/auth.js"
            }
        }
    </script>
</head>
<body class="min-h-full flex flex-col text-slate-800 antialiased bg-slate-50">

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 pointer-events-none flex flex-col items-center gap-2 max-w-sm w-full px-4"></div>

    <!-- Header Navigation for Staff -->
    <header class="sticky top-0 z-30 bg-white border-b-2 border-slate-200 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-xl bg-indigo-600 flex items-center justify-center text-white shadow-md">
                    <i class="fa-solid fa-users-gear text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-wider text-slate-900 flex items-center gap-2">
                        こども選挙 <span class="text-xs px-2.5 py-1 rounded-full bg-slate-100 text-slate-700 font-semibold border border-slate-300">受付管理 (S01-S06)</span>
                    </h1>
                    <p class="text-xs text-slate-500 font-bold">
                        ※投票結果の閲覧権限はありません。受付業務のみを行います。
                    </p>
                </div>
            </div>

            <div class="flex items-center gap-3">
                <!-- Account Logo / Staff Portal Link -->
                <a href="./login.html" id="mode-badge" class="px-3.5 py-2 rounded-xl text-xs font-bold bg-indigo-600 hover:bg-indigo-700 text-white shadow-md transition-all flex items-center gap-2 group" title="スタッフポータルを開く">
                    <div class="w-6 h-6 rounded-lg bg-white/20 flex items-center justify-center text-white text-xs group-hover:scale-110 transition-transform">
                        <i class="fa-solid fa-user-gear"></i>
                    </div>
                    <span>スタッフポータル</span>
                </a>
                <div id="header-user-widget"></div>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">

        <!-- S01: Dashboard Stats Overview -->
        <!-- Top Statistics Cards -->
        <section id="section-stats" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center gap-4">
                <div class="w-12 h-12 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center text-xl shrink-0">
                    <i class="fa-solid fa-users"></i>
                </div>
                <div>
                    <p class="text-xs text-slate-500 font-bold">参加者 登録数</p>
                    <p id="stat-participant-registered" class="text-2xl font-black text-slate-800">0人</p>
                </div>
            </div>
            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center gap-4">
                <div class="w-12 h-12 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-xl shrink-0">
                    <i class="fa-solid fa-user-check"></i>
                </div>
                <div>
                    <p class="text-xs text-slate-500 font-bold">受付完了数</p>
                    <p id="stat-ballots-issued" class="text-2xl font-black text-slate-800">0人</p>
                </div>
            </div>
        </section>

        <!-- Participant Registration Card -->
        <div class="bg-white p-6 sm:p-8 rounded-2xl border border-slate-200 shadow-sm space-y-6">
            <h2 class="text-lg font-black text-slate-900 flex items-center gap-2 border-b pb-4 border-slate-100">
                <span class="w-8 h-8 rounded-xl bg-indigo-600 text-white flex items-center justify-center text-sm shadow-sm">
                    <i class="fa-solid fa-user-plus text-xs"></i>
                </span>
                参加者の受付登録
            </h2>

            <form id="register-form" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-2">
                        <label for="register-age-group" class="text-xs font-bold text-slate-600 block">年齢区分 (必須)</label>
                        <select id="register-age-group" required
                                class="w-full px-4 py-3.5 border border-slate-300 rounded-xl font-bold text-slate-800 bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent text-sm">
                            <option value="" disabled selected>-- 年齢を選択してください --</option>
                            <option value="小学低学年">小学低学年 (1〜2年)</option>
                            <option value="小学中学年">小学中学年 (3〜4年)</option>
                            <option value="小学高学年">小学高学年 (5〜6年)</option>
                            <option value="中学生">中学生</option>
                            <option value="高校生">高校生</option>
                            <option value="未就学児・その他">未就学児・その他</option>
                        </select>
                    </div>

                    <div class="space-y-2">
                        <label for="register-municipality" class="text-xs font-bold text-slate-600 block">お住まいの市町村 (必須)</label>
                        <input type="text" id="register-municipality" placeholder="例: 〇〇市, 〇〇町" required
                               class="w-full px-4 py-3.5 border border-slate-300 rounded-xl font-bold text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent text-sm">
                    </div>
                </div>

                <div class="pt-2">
                    <button type="submit" class="w-full py-4 bg-emerald-600 hover:bg-emerald-700 text-white font-black text-base rounded-xl transition-all shadow-md flex items-center justify-center gap-2">
                        <i class="fa-solid fa-user-check text-lg"></i>
                        <span>参加者を登録する</span>
                    </button>
                </div>
            </form>
        </div>

        <!-- Reception Logs / Activities -->
        <section class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
            <div class="flex flex-col sm:flex-row justify-between sm:items-center gap-2 border-b pb-3 border-slate-100">
                <h2 class="text-lg font-black text-slate-900 flex items-center gap-2">
                    <span class="w-7 h-7 rounded-lg bg-slate-800 text-white flex items-center justify-center text-sm font-mono">
                        L
                    </span>
                    受付履歴ログ
                </h2>
                <div class="flex gap-2">
                    <button id="btn-refresh-logs" class="px-4 py-2 border border-slate-300 rounded-lg text-xs font-bold text-slate-700 hover:bg-slate-50 transition-all flex items-center gap-1.5">
                        <i class="fa-solid fa-rotate animate-spin-hover"></i>
                        <span>履歴更新</span>
                    </button>
                </div>
            </div>

            <!-- Logs table -->
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead>
                        <tr class="bg-slate-50 border-b border-slate-200 text-slate-500 font-bold text-xs uppercase">
                            <th class="p-3">日時</th>
                            <th class="p-3">受付番号</th>
                            <th class="p-3">年齢</th>
                            <th class="p-3">市町村</th>
                            <th class="p-3">ステータス</th>
                        </tr>
                    </thead>
                    <tbody id="logs-tbody" class="divide-y divide-slate-100 font-bold text-slate-700">
                        <tr>
                            <td colspan="5" class="p-8 text-center text-slate-400 text-xs">
                                ログをロード中...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <!-- Footer for staff -->
    <footer class="border-t border-slate-200 bg-white py-6 mt-12">
        <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row justify-between items-center gap-4 text-xs font-bold text-slate-400">
            <p>© 2026 こども選挙 事務局 受付管理システム</p>
            <div class="flex gap-4">
                <a href="./dashboard.html" class="hover:text-indigo-600 transition-colors flex items-center gap-1">
                    <i class="fa-solid fa-chart-line"></i> 当日ダッシュボード
                </a>
                <a href="./tally.html" class="hover:text-indigo-600 transition-colors flex items-center gap-1">
                    <i class="fa-solid fa-square-poll-vertical"></i> 開票管理
                </a>
                <a href="./index.html" class="hover:text-indigo-600 transition-colors flex items-center gap-1">
                    <i class="fa-solid fa-home"></i> こどもポータルへ戻る
                </a>
            </div>
        </div>
    </footer>

    <!-- Reception Script -->
    <script type="module" src="./reception.js"></script>
    <script>
        (function() {
            function escapeHtml(str) {
                if (!str) return '';
                return String(str)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#039;');
            }

            function loadAndRenderVoters() {
                let voters = [];
                try {
                    const raw = localStorage.getItem('kodomo_senkyo_voters');
                    voters = raw ? JSON.parse(raw) : [];
                    if (!Array.isArray(voters)) voters = [];
                } catch (e) {
                    voters = [];
                }

                // 1. カウント描画
                const regEl = document.getElementById('stat-participant-registered');
                if (regEl) regEl.innerText = voters.length + '人';
                const issueEl = document.getElementById('stat-ballots-issued');
                if (issueEl) issueEl.innerText = voters.length + '人';

                // 2. 履歴テーブル描画
                const tbody = document.getElementById('logs-tbody');
                if (tbody) {
                    if (voters.length === 0) {
                        tbody.innerHTML = `
                            <tr>
                                <td colspan="5" class="p-8 text-center text-slate-400 text-xs font-bold">
                                    受付された履歴はありません。
                                </td>
                            </tr>
                        `;
                    } else {
                        tbody.innerHTML = voters.map(log => {
                            let timeStr = '-';
                            if (log.created_at || log.issued_at || log.timestamp) {
                                try {
                                    const val = log.issued_at || log.created_at || log.timestamp;
                                    timeStr = new Date(val).toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                                    if (timeStr === 'Invalid Date') timeStr = '-';
                                } catch (e) {
                                    timeStr = '-';
                                }
                            }
                            return `
                                <tr class="hover:bg-indigo-50/50 transition-colors border-b border-slate-100">
                                    <td class="p-3 text-xs text-slate-400 font-mono">${timeStr}</td>
                                    <td class="p-3 font-mono">${escapeHtml(log.reg_number || '')}</td>
                                    <td class="p-3 text-xs">${escapeHtml(log.age_group || '')}</td>
                                    <td class="p-3 text-xs">${escapeHtml(log.municipality || '')}</td>
                                    <td class="p-3"><span class="px-2.5 py-1 text-xs rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200 font-bold">受付済</span></td>
                                </tr>
                            `;
                        }).join('');
                    }
                }
            }

            function setupForm() {
                loadAndRenderVoters();

                window.addEventListener('storage', loadAndRenderVoters);
                window.addEventListener('focus', loadAndRenderVoters);

                const btnRefresh = document.getElementById('btn-refresh-logs');
                if (btnRefresh) {
                    btnRefresh.addEventListener('click', function(e) {
                        e.preventDefault();
                        loadAndRenderVoters();
                    });
                }

                const form = document.getElementById('register-form');
                if (!form || form.dataset.bound) return;
                form.dataset.bound = "true";

                form.addEventListener('submit', function(e) {
                    e.preventDefault();
                    e.stopPropagation();

                    const ageEl = document.getElementById('register-age-group');
                    const muniEl = document.getElementById('register-municipality');
                    const ageGroup = ageEl ? ageEl.value : '';
                    const municipality = muniEl ? muniEl.value.trim() : '';

                    if (!ageGroup || !municipality) {
                        alert('年齢区分とお住まいの市町村を入力してください。');
                        return;
                    }

                    const regNumber = 'REG-' + Math.floor(1000 + Math.random() * 9000);
                    const nowTs = Date.now();
                    const nowIso = new Date(nowTs).toISOString();

                    const newVoter = {
                        id: 'voter_' + nowTs + '_' + Math.random().toString(36).substring(2, 6),
                        reg_number: regNumber,
                        age_group: ageGroup,
                        municipality: municipality,
                        status: 'ballot_issued',
                        is_revoked: false,
                        revoke_reason: null,
                        created_at: nowIso,
                        issued_at: nowIso,
                        timestamp: nowTs
                    };

                    let voters = [];
                    try {
                        const raw = localStorage.getItem('kodomo_senkyo_voters');
                        voters = raw ? JSON.parse(raw) : [];
                        if (!Array.isArray(voters)) voters = [];
                    } catch (err) {
                        voters = [];
                    }

                    voters.unshift(newVoter);

                    try {
                        localStorage.setItem('kodomo_senkyo_voters', JSON.stringify(voters));
                        window.dispatchEvent(new Event('storage'));
                    } catch (err) {}

                    form.reset();
                    loadAndRenderVoters();

                    // トースト通知描画
                    const container = document.getElementById('toast-container');
                    if (container) {
                        const toast = document.createElement('div');
                        toast.className = 'bg-emerald-600 text-white px-5 py-3.5 rounded-xl shadow-xl flex items-center gap-3 font-bold text-xs pointer-events-auto transition-all duration-300 transform translate-y-0 opacity-100';
                        toast.innerHTML = `<i class="fa-solid fa-circle-check text-base"></i><span>参加者「${regNumber}」の受付登録が完了しました！</span>`;
                        container.appendChild(toast);
                        setTimeout(() => toast.remove(), 3500);
                    }
                });
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', setupForm);
            } else {
                setupForm();
            }
        })();
    </script>
</body>
</html>
